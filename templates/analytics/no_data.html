{% extends "base.html" %}

{% block title %}Аналитика{% endblock %}

{% block page_header %}
<div class="page-header">
  <h1>Аналитика</h1>
</div>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:50vh">
  <div class="text-center" style="max-width:360px">
    <i class="bi bi-buildings" style="font-size:3.5rem;color:#cbd5e1"></i>
    <h4 class="mt-3 text-secondary">Нет жилых комплексов</h4>
    <p class="text-secondary" style="font-size:.9rem">
      Создайте хотя бы один жилой комплекс, чтобы начать работу с аналитикой.
    </p>
    <a href="{% url 'complex_list' %}" class="btn btn-primary mt-1">
      <i class="bi bi-plus-lg me-1"></i>Добавить комплекс
    </a>
  </div>
</div>
{% endblock %}
