{% extends "base.html" %}
{% block title %}Удалить план — {{ plan.name }}{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="card-section p-4 text-center">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size:2.5rem"></i>
    <h5 class="mt-3 fw-bold">Удалить план?</h5>
    <p class="text-muted">«{{ plan.name }}» — все задачи и помесячные данные будут удалены безвозвратно.</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="{% url 'calendar_plan_list' blk.pk %}" class="btn btn-outline-secondary">Отмена</a>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
